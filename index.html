<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>积分提案排行榜（云端共享版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .status{
            text-align:center;
            margin-bottom:16px;
            color:#475569;
        }
        .input-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
            display: flex;
            gap:12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom:24px;
        }
        .input-box input{
            padding:10px 14px;
            border:1px solid #ccd4dd;
            border-radius:6px;
            font-size:16px;
            width:150px;
        }
        button{
            padding:10px 18px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }
        #submitBtn{
            background-color: #2563eb;
            color:white;
        }
        #clearAll{
            background-color:#dc2626;
            color:white;
        }
        #refreshBtn{
            background-color:#10b981;
            color:white;
        }
        table{
            width:100%;
            background:#fff;
            border-radius:10px;
            overflow:hidden;
            box-shadow: 0 2px 8px #00000015;
            border-collapse: collapse;
        }
        th,td{
            padding:14px 16px;
            text-align:center;
            border-bottom:1px solid #eee;
            font-size:16px;
        }
        th{
            background-color:#2c3e50;
            color:white;
        }
        .del-btn{
            background:#ef4444;
            color:#fff;
            padding:6px 10px;
            font-size:14px;
        }
        .rank-1{
            background:#fffbeb;
        }
        .rank-2{
            background:#f1f5f9;
        }
        .rank-3{
            background:#fef2f2;
        }
        .tip{
            color:#64748b;
            font-size:14px;
            width:100%;
        }
    </style>
</head>
<body>
    <h1>积分提案排行榜</h1>
    <div class="status">云端同步数据 | 所有人打开链接看到同一份榜单</div>
    <div class="input-box">
        <input type="text" id="nameInput" placeholder="输入姓名">
        <input type="number" id="scoreDelta" placeholder="积分变动，+增加/-减少">
        <input type="number" id="proposalDelta" placeholder="提案变动，+增加/-减少">
        <button id="submitBtn">提交</button>
        <button id="refreshBtn">刷新榜单</button>
        <button id="clearAll">清空全部</button>
        <div class="tip">新名字：填入数值作为初始积分、初始提案；已有名字：数值叠加；不需要变动填0</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>排名</th>
                <th>姓名</th>
                <th>积分</th>
                <th>提案数量</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5">加载中...</td></tr>
        </tbody>
    </table>

<script>
    const API_URL = "/api/data";
    const tableBody = document.getElementById("tableBody");
    const nameInput = document.getElementById("nameInput");
    const scoreDelta = document.getElementById("scoreDelta");
    const proposalDelta = document.getElementById("proposalDelta");
    const submitBtn = document.getElementById("submitBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearAll = document.getElementById("clearAll");

    async function loadData(){
        const res = await fetch(API_URL);
        const list = await res.json();
        render(list);
    }

    function render(list){
        list.sort((a,b)=> b.score - a.score);
        tableBody.innerHTML = "";
        list.forEach((item,idx)=>{
            const tr = document.createElement("tr");
            if(idx===0) tr.className="rank-1";
            if(idx===1) tr.className="rank-2";
            if(idx===2) tr.className="rank-3";
            tr.innerHTML = `
                <td>${idx+1}</td>
                <td>${item.name}</td>
                <td>${item.score}</td>
                <td>${item.proposal}</td>
                <td><button class="del-btn" data-name="${item.name}">删除</button></td>
            `
            tableBody.appendChild(tr);
        })
        document.querySelectorAll(".del-btn").forEach(btn=>{
            btn.onclick = async ()=>{
                const n = btn.dataset.name;
                await fetch(API_URL, {
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({action:"delete", name:n})
                })
                loadData();
            }
        })
    }

    submitBtn.onclick = async ()=>{
        const name = nameInput.value.trim();
        const dScore = Number(scoreDelta.value);
        const dProposal = Number(proposalDelta.value);
        if(!name){
            alert("请输入姓名");
            return;
        }
        if(isNaN(dScore) || isNaN(dProposal)){
            alert("积分变动、提案变动请输入有效数字，不动该项填0");
            return;
        }
        await fetch(API_URL, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                action:"update",
                name,
                dScore,
                dProposal
            })
        })
        loadData();
        nameInput.value = "";
        scoreDelta.value = "";
        proposalDelta.value = "";
    }

    clearAll.onclick = async ()=>{
        if(!confirm("确定清空云端所有排行榜数据吗？不可恢复！")) return;
        await fetch(API_URL, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"clear"})
        })
        loadData();
    }

    refreshBtn.onclick = ()=> loadData();

    loadData();
</script>
</body>
</html>
